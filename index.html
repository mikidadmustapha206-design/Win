<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ghana Giveaway Spin</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #0f172a;
  color: white;
  text-align: center;
  padding: 20px;
}

h1 {
  color: #22c55e;
}

button {
  padding: 12px 20px;
  border: none;
  border-radius: 10px;
  background: #22c55e;
  color: black;
  font-weight: bold;
  cursor: pointer;
  margin-top: 20px;
}

#wheel {
  margin: 40px auto;
  width: 200px;
  height: 200px;
  border-radius: 50%;
  border: 8px solid #22c55e;
  display: flex;
  align-items: center;
  justify-content: center;
}

#result {
  margin-top: 20px;
  font-size: 20px;
}
</style>
</head>
<body>

<h1>🇬🇭 Ghana Spin & Win</h1>
<p>Spin and win airtime, data & more!</p>

<div id="wheel">🎁</div>

<button onclick="spin()">SPIN</button>

<div id="result"></div>

<script>
function spin() {
  const rewards = [
    "₵5 Airtime",
    "₵10 Airtime",
    "1GB Data",
    "Better Luck Next Time",
    "₵20 Airtime",
    "Free Gift 🎁"
  ];

  const win = rewards[Math.floor(Math.random() * rewards.length)];

  document.getElementById("result").innerHTML =
    "🎉 You got: " + win + "<br><br>" +
    "<a href='https://chat.whatsapp.com/YOUR-LINK' target='_blank'>" +
    "<button>Claim Reward</button></a>";
}
</script>

</body>
</html>
